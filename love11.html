<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Montserrat',sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at center,
            #641a42 0%,
            #2a091f 35%,
            #080208 100%
        );
}


/* =====================================================
   CANVAS
===================================================== */

#heartCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:1;
}


/* =====================================================
   BACKGROUND LIGHT
===================================================== */

.glow{
    position:fixed;

    width:700px;
    height:700px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,65,155,.25),
            transparent 70%
        );

    filter:blur(50px);

    animation:
        glowPulse 6s ease-in-out infinite;

    z-index:0;
}

@keyframes glowPulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.85);

        opacity:.6;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.2);

        opacity:1;
    }
}


/* =====================================================
   STARS
===================================================== */

#stars{
    position:fixed;
    inset:0;

    z-index:2;

    pointer-events:none;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 7px white,
        0 0 15px #ff6da8;

    animation:
        sparkle ease-in-out infinite;
}

@keyframes sparkle{

    0%,100%{
        opacity:.05;
        transform:scale(.5);
    }

    50%{
        opacity:1;
        transform:scale(2);
    }
}


/* =====================================================
   CENTER
===================================================== */

.center{
    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    z-index:10;
}


/* =====================================================
   PREMIUM GLASS CARD
===================================================== */

.card{

    width:min(700px,92vw);

    padding:60px 45px;

    border-radius:42px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(30px);

    -webkit-backdrop-filter:blur(30px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.7),

        inset 0 0 60px
        rgba(255,255,255,.025),

        0 0 100px
        rgba(255,40,140,.15);

    animation:
        entrance 2s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes entrance{

    from{

        opacity:0;

        transform:
            translateY(60px)
            scale(.82);

        filter:blur(15px);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


/* =====================================================
   MAIN HEART
===================================================== */

.mainHeart{

    font-size:58px;

    display:inline-block;

    margin-bottom:15px;

    filter:
        drop-shadow(0 0 12px #ff3c8d)
        drop-shadow(0 0 35px #ff176f);

    animation:
        heartbeat 1.5s infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.2);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.12);
    }
}


/* =====================================================
   LABEL
===================================================== */

.label{

    font-size:10px;

    letter-spacing:7px;

    color:#ff9ac5;

    margin-bottom:12px;
}


/* =====================================================
   TITLE
===================================================== */

h1{

    font-family:
        'Great Vibes',
        cursive;

    font-size:
        clamp(70px,12vw,110px);

    font-weight:400;

    line-height:1;

    margin-bottom:20px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffb8d7,
            #fff
        );

    background-size:200%;

    -webkit-backgroundclip:text;

    color:transparent;

    animation:
        titleShine 5s linear infinite;
}

@keyframes titleShine{

    to{
        background-position:200%;
    }
}


/* =====================================================
   DIVIDER
===================================================== */

.divider{

    width:110px;

    height:1px;

    margin:
        0 auto 28px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff70aa,
            transparent
        );
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    max-width:560px;

    min-height:145px;

    margin:auto;

    font-size:16px;

    line-height:2;

    font-weight:300;

    color:
        rgba(255,255,255,.86);
}

.cursor{

    color:#ff75ad;

    animation:
        blink .7s infinite;
}

@keyframes blink{

    50%{
        opacity:0;
    }
}


/* =====================================================
   BUTTON
===================================================== */

.button{

    margin-top:25px;

    padding:
        15px 42px;

    border-radius:100px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        linear-gradient(
            135deg,
            #ff4d98,
            #d91565
        );

    color:white;

    font-family:
        'Montserrat';

    font-size:13px;

    cursor:pointer;

    box-shadow:
        0 10px 35px
        rgba(255,30,120,.3);

    transition:.35s;
}

.button:hover{

    transform:
        translateY(-5px)
        scale(1.06);

    box-shadow:
        0 18px 55px
        rgba(255,30,120,.55);
}


/* =====================================================
   FINAL MESSAGE
===================================================== */

.final{

    max-height:0;

    overflow:hidden;

    opacity:0;

    transition:

        max-height 1.5s ease,

        opacity 1s ease,

        margin 1s ease;
}

.final.show{

    max-height:300px;

    opacity:1;

    margin-top:30px;
}

.finalHeart{

    font-size:32px;

    animation:
        heartbeat 1.4s infinite;
}

.final h2{

    font-family:
        'Great Vibes',
        cursive;

    font-weight:400;

    font-size:48px;

    color:#ffb4d7;

    margin-top:8px;

    text-shadow:
        0 0 20px
        rgba(255,70,150,.6);
}

.final p{

    margin-top:10px;

    font-size:13px;

    line-height:1.8;

    color:
        rgba(255,255,255,.65);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .card{
        padding:45px 25px;
    }

    .message{
        font-size:14px;
        line-height:1.9;
    }

    h1{
        font-size:65px;
    }

    .final h2{
        font-size:40px;
    }
}
</style>
</head>


<body>


<!-- ================================================
     BACKGROUND
================================================ -->

<div class="glow"></div>

<canvas id="heartCanvas"></canvas>

<div id="stars"></div>


<!-- ================================================
     CENTER CONTENT
================================================ -->

<div class="center">

<div class="card">

    <div class="mainHeart">
        ❤️
    </div>

    <div class="label">
        A MESSAGE FROM MY HEART
    </div>

    <h1>
        Hey, You...
    </h1>

    <div class="divider"></div>

    <div
        class="message"
        id="message">
    </div>

    <button
        class="button"
        onclick="reveal()">

        Open My Heart 💗

    </button>


    <div
        class="final"
        id="final">

        <div class="finalHeart">
            💖
        </div>

        <h2>
            I really like you.
        </h2>

        <p>
            I don't need you to say anything right now.
            <br>
            I just wanted you to know.
            ❤️
        </p>

    </div>

</div>

</div>


<script>

/* =====================================================
   1500+ FLOATING HEART ENGINE
===================================================== */

const canvas =
    document.getElementById("heartCanvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;

function resize(){

    width =
        canvas.width =
        window.innerWidth *
        devicePixelRatio;

    height =
        canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    width =
        window.innerWidth;

    height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* --------------------------------
   HEART OBJECT
-------------------------------- */

const heartCount = 1600;

const floatingHearts = [];

const colors = [
    "#ff3b7d",
    "#ff4f91",
    "#ff6ba8",
    "#ff8fbd",
    "#ffb1d0",
    "#ffd1e2",
    "#ff206e"
];

for(
    let i=0;
    i<heartCount;
    i++
){

    floatingHearts.push({

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        size:
            3 +
            Math.random() *
            14,

        speed:
            .15 +
            Math.random() *
            .8,

        drift:
            (Math.random()-.5)
            * .35,

        rotation:
            Math.random() *
            Math.PI*2,

        rotationSpeed:
            (Math.random()-.5)
            * .01,

        alpha:
            .15 +
            Math.random() *
            .65,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]
    });
}


/* --------------------------------
   HEART DRAWING
-------------------------------- */

function drawHeart(
    x,
    y,
    size,
    rotation,
    color,
    alpha
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(rotation);

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.moveTo(
        0,
        size*.3
    );

    ctx.bezierCurveTo(
        -size*1.1,
        -size*.3,
        -size*.7,
        -size,
        0,
        -size*.35
    );

    ctx.bezierCurveTo(
        size*.7,
        -size,
        size*1.1,
        -size*.3,
        0,
        size*.3
    );

    ctx.fill();

    ctx.restore();
}


/* --------------------------------
   ANIMATION
-------------------------------- */

function animateHearts(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for(
        const heart
        of floatingHearts
    ){

        heart.y -=
            heart.speed;

        heart.x +=
            heart.drift;

        heart.rotation +=
            heart.rotationSpeed;


        if(
            heart.y <
            -40
        ){

            heart.y =
                window.innerHeight
                + 40;

            heart.x =
                Math.random() *
                window.innerWidth;
        }


        if(
            heart.x < -50
        )
            heart.x =
                window.innerWidth+50;

        if(
            heart.x >
            window.innerWidth+50
        )
            heart.x=-50;


        drawHeart(
            heart.x,
            heart.y,
            heart.size,
            heart.rotation,
            heart.color,
            heart.alpha
        );
    }

    requestAnimationFrame(
        animateHearts
    );
}

animateHearts();


/* =====================================================
   STARS
===================================================== */

const stars =
    document.getElementById("stars");

for(
    let i=0;
    i<120;
    i++
){

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDuration =
        (2+
        Math.random()*4)+"s";

    star.style.animationDelay =
        Math.random()*5+"s";

    stars.appendChild(star);
}


/* =====================================================
   TYPING MESSAGE
===================================================== */

const messageText =

"Some people come into your life quietly. There is no warning, no special moment, and no explanation. Then one day you realize that their smile stays in your mind a little longer, their messages make your day a little brighter, and somehow you find yourself hoping to see them again. That person became you for me.";

const message =
    document.getElementById(
        "message"
    );

let index=0;

function typeMessage(){

    if(
        index <
        messageText.length
    ){

        message.innerHTML =
            messageText.substring(
                0,
                index+1
            )
            +
            '<span class="cursor">|</span>';

        index++;

        setTimeout(
            typeMessage,
            32
        );

    }else{

        message.innerHTML =
            messageText
            +
            '<span class="cursor">|</span>';
    }
}

setTimeout(
    typeMessage,
    1800
);


/* =====================================================
   FINAL REVEAL
===================================================== */

function reveal(){

    document
        .getElementById("final")
        .classList.add("show");

    heartExplosion();

}


/* =====================================================
   HEART EXPLOSION
===================================================== */

function heartExplosion(){

    const amount=150;

    for(
        let i=0;
        i<amount;
        i++
    ){

        const heart =
            document.createElement(
                "div"
            );

        heart.innerHTML =
            "❤️";

        heart.style.position =
            "fixed";

        heart.style.left =
            "50%";

        heart.style.top =
            "50%";

        heart.style.zIndex =
            "100";

        heart.style.fontSize =
            (10+
            Math.random()*28)
            +"px";

        heart.style.pointerEvents =
            "none";

        const angle =
            Math.random() *
            Math.PI*2;

        const distance =
            100+
            Math.random()*500;

        const x =
            Math.cos(angle)
            * distance;

        const y =
            Math.sin(angle)
            * distance;

        heart.animate(

            [

                {
                    transform:
                    "translate(-50%,-50%) scale(0)",

                    opacity:1
                },

                {

                    transform:
                    `translate(
                        calc(-50% + ${x}px),
                        calc(-50% + ${y}px)
                    )
                    scale(1.5)`,

                    opacity:0
                }

            ],

            {

                duration:
                    1200+
                    Math.random()*1000,

                easing:
                    "cubic-bezier(.15,.8,.2,1)"
            }
        );

        document.body.appendChild(
            heart
        );

        setTimeout(
            ()=>heart.remove(),
            2400
        );
    }
}

</script>

</body>
</html>
